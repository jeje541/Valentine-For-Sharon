<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Valentine’s Day, Laura Sharon Putri Kusuma!</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      text-align: center;
      background: linear-gradient(to bottom, #ff9a9e, #fad0c4);
      color: #fff;
      overflow: hidden;
      padding: 20px;
    }
    h1 {
      font-size: 3em;
      margin-top: 50px;
      animation: fadeIn 3s ease-in-out;
    }
    p {
      font-size: 1.5em;
      margin: 20px 0;
    }
    .heart {
      font-size: 5em;
      color: red;
      animation: heartbeat 1.5s infinite;
    }
    button {
      background-color: #ff6f61;
      border: none;
      padding: 15px 30px;
      font-size: 1.2em;
      color: white;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #e63946;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes heartbeat {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .snowflake {
      position: fixed;
      top: -10px;
      z-index: 999;
      font-size: 1.5em;
      color: white;
      animation: fall 10s linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(0); }
      100% { transform: translateY(100vh); }
    }
  </style>
</head>
<body>
  <h1>Happy Valentine’s Day, Laura Sharon Putri Kusuma!</h1>
  <div class="heart">❤️</div>
  <p>Untuk adikku tersayang, semoga harimu penuh dengan cinta, tawa, dan kebahagiaan. Terima kasih sudah menjadi adik yang paling luar biasa!</p>
  <button onclick="showMessage()">Klik untuk Kejutan!</button>
  <p id="surprise" style="display:none; margin-top: 20px;">Aku sayang kamu, Laura! Jangan pernah lupa kalau aku akan selalu ada buat kamu!</p>

  <audio id="background-music" loop autoplay>
    <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mp3">
    Your browser does not support the audio element.
  </audio>

  <script>
    function showMessage() {
      document.getElementById('surprise').style.display = 'block';
    }

    // Salju efek
    const snowflakes = "❄️✨❅";
    setInterval(() => {
      const snowflake = document.createElement("div");
      snowflake.className = "snowflake";
      snowflake.textContent = snowflakes[Math.floor(Math.random() * snowflakes.length)];
      snowflake.style.left = Math.random() * 100 + "vw";
      snowflake.style.animationDuration = Math.random() * 3 + 7 + "s";
      document.body.appendChild(snowflake);
      setTimeout(() => snowflake.remove(), 10000);
    }, 300);
  </script>
</body>
</html>
